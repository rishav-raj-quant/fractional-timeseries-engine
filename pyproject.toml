[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fractional-timeseries-engine"
version = "0.1.0"
description = "Fractional Differencing Memory Optimization, Multi-Method Hurst Estimators & Rough Volterra Path Engine."
readme = "README.md"
authors = [{ name = "Rishav Raj" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::statsmodels.tools.sm_exceptions.InterpolationWarning",
]


